# Intégration continue : à chaque push sur main/develop et à chaque
# Pull Request, GitHub vérifie le style et lance les tests.
# Une étape en échec = croix rouge = on ne fusionne pas.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Clé factice, uniquement pour la CI (la vraie est dans .env).
      SECRET_KEY: cle-de-ci-uniquement
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Style (pycodestyle)
        run: pycodestyle sentinel app.py cli.py tests

      - name: Tests et couverture (80 % minimum)
        run: pytest --cov=sentinel --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci : installe exactement les versions de package-lock.json.
      - name: Installer les dépendances
        run: npm ci

      - name: Style (ESLint)
        run: npm run lint

      - name: Construction du front
        run: npm run build
